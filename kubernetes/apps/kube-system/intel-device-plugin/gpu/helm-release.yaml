---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: intel-device-plugin-gpu
spec:
  interval: 30m
  chart:
    spec:
      chart: intel-device-plugins-gpu
      version: 0.37.0
      sourceRef:
        kind: HelmRepository
        name: intel-charts
        namespace: flux-system
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  dependsOn:
    - name: intel-device-plugin-operator
      namespace: kube-system
  values:
    name: intel-device-plugin-gpu
    # Step 1 of retiring this chart: helm uninstall must leave the GpuDevicePlugin
    # in place so Flux can adopt it as a plain manifest without the plugin going down.
    annotations:
      helm.sh/resource-policy: keep
    sharedDevNum: 3
    nodeFeatureRule: true
