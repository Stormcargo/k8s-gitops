---
grafanaDashboard:
  enabled: true
service:
  registry:
    hostPort: 29999
    # Hints need topology.kubernetes.io/zone on nodes; single-zone cluster, so they
    # only produced TopologyAwareHintsDisabled warning events
    topologyAwareHintsEnabled: false
serviceMonitor:
  enabled: true
spegel:
  containerdSock: /run/containerd/containerd.sock
  containerdRegistryConfigPath: /etc/cri/conf.d/hosts
