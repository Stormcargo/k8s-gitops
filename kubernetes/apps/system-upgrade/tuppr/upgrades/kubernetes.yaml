---
apiVersion: tuppr.home-operations.com/v1alpha1
kind: KubernetesUpgrade
metadata:
  name: kubernetes
spec:
  kubernetes:
    # renovate: depName=ghcr.io/siderolabs/kubelet datasource=docker
    version: v1.34.6
  healthChecks:
    - apiVersion: apps/v1
      kind: DaemonSet
      name: cilium
      namespace: kube-system
      description: Cilium agents ready on all nodes
      expr: status.numberReady == status.desiredNumberScheduled && status.updatedNumberScheduled == status.desiredNumberScheduled
      timeout: 10m
    - apiVersion: longhorn.io/v1beta2
      kind: Volume
      namespace: storage
      description: Longhorn volumes healthy or detached
      expr: status.state == 'detached' || status.robustness == 'healthy'
      timeout: 15m
  # maintenance:
  #   windows:
  #     - start: "0 2 * * *"
  #       duration: 4h
  #       timezone: "${TIMEZONE}"
