---
apiVersion: tuppr.home-operations.com/v1alpha1
kind: TalosUpgrade
metadata:
  name: talos
spec:
  talos:
    # renovate: depName=ghcr.io/siderolabs/installer datasource=docker
    version: v1.13.9
  policy:
    placement: hard
    waitForVolumeDetach: true
  healthChecks:
    - apiVersion: apps/v1
      kind: DaemonSet
      name: cilium
      namespace: kube-system
      description: Cilium agents ready on all nodes
      expr: status.numberReady == status.desiredNumberScheduled && status.updatedNumberScheduled == status.desiredNumberScheduled
      timeout: 10m
    # - apiVersion: longhorn.io/v1beta2
    #   kind: Volume
    #   namespace: storage
    #   description: Longhorn volumes healthy or detached
    #   expr: status.state == 'detached' || status.robustness == 'healthy'
    #   timeout: 15m
  silences:
    - matchers:
        - name: alertname
          matchType: =~
          value: KubeNodeNotReady|KubeNodeUnreachable|KubeNodeReadinessFlapping|KubeNodeEviction|KubeletDown|KubeletInstanceUnreachable|NodeClockNotSynchronising|NodeClockSkewDetected
      maxDuration: 2h
    - matchers:
        - name: alertname
          matchType: =~
          value: KubePodNotReady|KubePodCrashLooping|KubeDeploymentReplicasMismatch|KubeStatefulSetReplicasMismatch|KubeDaemonSetRolloutStuck|KubeDaemonSetNotScheduled|KubePdbNotEnoughHealthyPods|TargetDown
      maxDuration: 2h
  # maintenance:
  #   windows:
  #     - start: "0 2 * * *"
  #       duration: 4h
  #       timezone: "${TIMEZONE}"
