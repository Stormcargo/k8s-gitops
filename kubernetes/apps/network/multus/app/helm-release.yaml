---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: multus
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    global:
      createDefaultServiceAccount: false

    controllers:
      multus:
        type: daemonset
        pod:
          automountServiceAccountToken: true
          hostNetwork: true

        initContainers:
          cni-plugins:
            image:
              repository: ghcr.io/home-operations/cni-plugins
              tag: 1.9.1

        containers:
          multus:
            image:
              repository: ghcr.io/k8snetworkplumbingwg/multus-cni
              tag: v4.3.0
            args:
              - --cleanup-config-on-exit=true
            # Reach the apiserver via Talos KubePrism instead of the 10.96.0.1
            # ClusterIP. multus generates /host/etc/cni/net.d/multus.kubeconfig
            # from these vars, and the ClusterIP is served by Cilium's socket-LB
            # -- so on a freshly rebooted node multus cannot create ANY pod
            # sandbox until Cilium's datapath converges (FailedCreatePodSandBox,
            # "context deadline exceeded" against 10.96.0.1:443, minutes long
            # after every Talos upgrade reboot). KubePrism is CNI-independent;
            # the pods are hostNetwork so 127.0.0.1 is the host's listener.
            # Cilium already does exactly this for the same reason.
            env:
              KUBERNETES_SERVICE_HOST: "127.0.0.1"
              KUBERNETES_SERVICE_PORT: "7445"
            resources:
              requests:
                cpu: "10m"
              limits:
                memory: "512Mi"
            securityContext:
              privileged: true

    persistence:
      etc-cni-net-d:
        type: hostPath
        hostPath: /etc/cni/net.d
        globalMounts:
          - path: /host/etc/cni/net.d
      opt-cni-bin:
        type: hostPath
        hostPath: /opt/cni/bin
        globalMounts:
          - path: /host/opt/cni/bin

    rbac:
      roles:
        multus:
          type: ClusterRole
          rules:
            - apiGroups:
                - "k8s.cni.cncf.io"
              resources:
                - "*"
              verbs:
                - "*"
            - apiGroups:
                - ""
              resources:
                - "pods"
                - "pods/status"
              verbs:
                - "get"
                - "update"
            - apiGroups:
                - ""
                - "events.k8s.io"
              resources:
                - "events"
              verbs:
                - "create"
                - "patch"
                - "update"
      bindings:
        multus:
          type: ClusterRoleBinding
          roleRef:
            identifier: multus
          subjects:
            - identifier: multus

    serviceAccount:
      multus: {}
