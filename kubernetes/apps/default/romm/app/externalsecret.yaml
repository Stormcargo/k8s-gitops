---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: romm
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: romm-secret
    template:
      data:
        # App
        IGDB_CLIENT_ID: "{{ .IGDB_CLIENT_ID }}"
        IGDB_CLIENT_SECRET: "{{ .IGDB_CLIENT_SECRET }}"
        STEAMGRIDDB_API_KEY: "{{ .STEAMGRIDDB_API_KEY }}"
        ROMM_AUTH_SECRET_KEY: "{{ .ROMM_AUTH_SECRET_KEY }}"
        RETROACHIEVEMENTS_API_KEY: "{{ .RETROACHIEVEMENTS_API_KEY }}"
        # Database. The role and database are provisioned declaratively by the
        # CNPG DatabaseRole/Database CRs under kubernetes/apps/databases, so the
        # names are pinned there and mirrored here as literals.
        DB_HOST: "postgres17-rw.databases.svc.cluster.local"
        DB_PORT: "5432"
        DB_USER: "romm"
        DB_PASSWD: "{{ .ROMM_POSTGRES_PASSWORD }}"
        DB_NAME: "rommdb"
  dataFrom:
    - extract:
        key: romm
