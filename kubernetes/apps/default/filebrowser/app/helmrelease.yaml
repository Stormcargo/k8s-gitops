---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app filebrowser
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      filebrowser:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/gtsteffaniak/filebrowser
              tag: 1.5.5-stable
            env:
              TZ: ${TIMEZONE}
              FILEBROWSER_CONFIG: /config/config.yaml
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &port 80
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 30
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 2Gi
        pod:
          securityContext:
            runAsUser: 568
            runAsGroup: 568
            runAsNonRoot: true
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch
            supplementalGroups: [10000]
    service:
      app:
        controller: filebrowser
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          glance/internal: "true"
          glance/icon: di:filebrowser-quantum
          glance/description: File Manager
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: http
    configMaps:
      config:
        enabled: true
        data:
          config.yaml: |
            server:
              port: 80
              baseURL: "/"
              database: "/home/filebrowser/data/database.db"
              cacheDir: "/home/filebrowser/data/tmp"
              cacheDirCleanup: true
              logging:
                - levels: "info|warning|error"
              sources:
                - path: "/srv"
                  name: "nas"
                  config:
                    defaultEnabled: true
                    rules:
                      - includeRootItem: "Documents"
                      - includeRootItem: "Media"
                      - includeRootItem: "downloads"
                      - includeRootItem: "consume"
            auth:
              methods:
                noauth: true
    persistence:
      config:
        existingClaim: filebrowser
        globalMounts:
          - path: /home/filebrowser/data
      fbconfig:
        type: configMap
        identifier: config
        globalMounts:
          - path: /config
            readOnly: true
      data:
        type: nfs
        server: ${NAS_ADDR}
        path: /mnt/external
        globalMounts:
          - path: /srv
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp
