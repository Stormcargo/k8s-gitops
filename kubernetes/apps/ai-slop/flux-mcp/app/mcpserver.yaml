---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: flux
spec:
  image: ghcr.io/controlplaneio-fluxcd/flux-operator-mcp:v0.60.0@sha256:9940c2c46c1bff5af3827cb76f28a1ff347ea8141ed1af42e66ffbd79e8c4bdb
  # Stateless streamable HTTP (MCP spec 2026-07-28); the legacy sse transport was removed upstream.
  transport: streamable-http
  mcpPort: 9090
  # Cluster credentials come from the pod service account, not a kubeconfig.
  serviceAccount: flux-mcp
  groupRef:
    name: mcp-tools
  args:
    - serve
    - --transport=http
    - --port=9090
    - --read-only=false
    - --mask-secrets=true
  podTemplateSpec:
    spec:
      containers:
        - name: mcp
          env:
            - name: RUNTIME_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            limits:
              cpu: "500m"
            requests:
              cpu: "10m"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
  resources:
    limits:
      cpu: 200m
      memory: 512Mi
    requests:
      cpu: 10m
      memory: 128Mi
