---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: kubesearch
spec:
  image: ghcr.io/perfectra1n/kubesearch-mcp:1.1.0@sha256:4b39b2e708a1e038f3d8b33393eb93327aa2f29643dd12decb421efe68d11459
  transport: stdio
  groupRef:
    name: mcp-tools
  env:
    # The image defaults to the HTTP transport; toolhive fronts stdio itself.
    - name: MCP_TRANSPORT
      value: stdio
    - name: KUBESEARCH_CACHE_DIR
      value: /data
    - name: KUBESEARCH_CLONE_DIR
      value: /data/clones
  podTemplateSpec:
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: mcp
          resources:
            limits:
              cpu: "500m"
            requests:
              cpu: "10m"
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: kubesearch-mcp
        - name: tmp
          emptyDir: {}
  resources:
    limits:
      cpu: 200m
      memory: 512Mi
    requests:
      cpu: 10m
      memory: 256Mi
