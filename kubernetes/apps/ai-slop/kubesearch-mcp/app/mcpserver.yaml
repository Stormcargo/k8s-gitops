---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: kubesearch
spec:
  image: ghcr.io/perfectra1n/kubesearch-mcp:1.3.0@sha256:4620f09fffb30672b429b9bbffb8a657d34dcee420729598c3f65732a3c89079
  transport: stdio
  groupRef:
    name: mcp-tools
  env:
    # The image defaults to the HTTP transport; toolhive fronts stdio itself.
    - name: MCP_TRANSPORT
      value: stdio
    - name: KUBESEARCH_CACHE_DIR
      value: /data
    - name: KUBESEARCH_CLONE_DIR
      value: /data/clones
  podTemplateSpec:
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: mcp
          resources:
            limits:
              cpu: "500m"
              memory: 1Gi
            requests:
              cpu: "10m"
              memory: 640Mi # ~576Mi observed
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: kubesearch-mcp
        - name: tmp
          emptyDir: {}
  resources:
    limits:
      cpu: 200m
      memory: 512Mi
    requests:
      cpu: 10m
      memory: 256Mi
