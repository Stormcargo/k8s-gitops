---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app tunarr
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  maxHistory: 2
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  uninstall:
    keepHistory: false
  values:
    controllers:
      tunarr:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/chrisbenincasa/tunarr
              tag: 1.3.15@sha256:ae8ec490459e773571b277e2f64248605c1ea64d49ee4d26aa01741409d60369
            env:
              TZ: ${TIMEZONE}
              # The binary is a pkg snapshot: it extracts native addons
              # (better-sqlite3 et al) to $HOME/.cache at load time. The image
              # leaves HOME=/root, which uid 1000 cannot write. Point it at a
              # writable emptyDir rather than the PVC so it stays out of restic.
              HOME: &home /home/tunarr
              # Tunarr only defaults to /config/tunarr when it detects Docker.
              # That probe reads /.dockerenv and /proc/self/cgroup, both of which
              # come up empty under Talos + cgroup v2, so it falls back to
              # $HOME/.local/share/tunarr (= /root) and dies with EACCES. Pin it.
              TUNARR_DATABASE_PATH: /config/tunarr
              TUNARR_LOG_LEVEL: info
              TUNARR_SERVER_PORT: &port 8000
              # Behind the Envoy gateway, so honour X-Forwarded-* for client IPs
              TUNARR_SERVER_TRUST_PROXY: "true"
              # Meilisearch is embedded and indexes in-process; keep it from
              # eating the whole memory limit during a library scan
              TUNARR_SEARCH_MAX_MEMORY: 1024Mb
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/system/health
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
              # Boot spawns Meilisearch and runs DB migrations; give it room
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/system/health
                    port: *port
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 30
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                gpu.intel.com/i915: 1
                cpu: 100m
                memory: 1Gi
              limits:
                gpu.intel.com/i915: 1
                memory: 4Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups: [44]
      nodeSelector:
        intel.feature.node.kubernetes.io/gpu: "true"
    service:
      app:
        controller: *app
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          glance/internal: "true"
          glance/icon: di:tunarr
          glance/description: Live TV Channels
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: http
    persistence:
      config:
        existingClaim: *app
        globalMounts:
          - path: /config/tunarr
      # Tunarr writes HLS segments and logs underneath its data directory.
      # Keep both off Longhorn so they aren't replicated or pushed to restic.
      streams:
        type: emptyDir
        sizeLimit: 8Gi
        globalMounts:
          - path: /config/tunarr/streams
      logs:
        type: emptyDir
        globalMounts:
          - path: /config/tunarr/logs
      # Same mount point as Plex so library paths line up for direct file access
      media:
        type: nfs
        server: ${NAS_ADDR}
        path: /mnt/external/Media
        globalMounts:
          - path: /media
            readOnly: true
      home:
        type: emptyDir
        globalMounts:
          - path: *home
      tmp:
        type: emptyDir
