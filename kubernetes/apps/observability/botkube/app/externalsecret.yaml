apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: botkube-external-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: botkube-config-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Rendered as a values file, not injected per key with valuesFrom.targetPath:
        # targetPath parses the 18-19 digit Discord IDs as int64, which come back
        # from Helm storage as float64. The release then never matches its
        # recorded digest, and helm-controller re-upgraded every interval.
        values.yaml: |
          communications:
            default-group:
              discord:
                token: {{ .BOTKUBE_DISCORD_TOKEN | quote }}
                botID: {{ .BOTKUBE_DISCORD_BOT_ID | quote }}
                channels:
                  default:
                    id: {{ .BOTKUBE_DISCORD_CHANNEL_ID | quote }}
  dataFrom:
    - extract:
        key: botkube
