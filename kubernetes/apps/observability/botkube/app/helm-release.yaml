---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: botkube
spec:
  interval: 5m
  chart:
    spec:
      # renovate: registryUrl=https://charts.botkube.io/
      chart: botkube
      version: v1.14.0
      sourceRef:
        kind: HelmRepository
        name: botkubeio-charts
        namespace: flux-system
      interval: 5m
  install:
    createNamespace: true
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5
  values:
    replicaCount: 1

    settings:
      clusterName: k8s-cluster
      configWatcher: true

    # -- Role Based Access for Botkube Pod and plugins.
    # [Ref doc](https://kubernetes.io/docs/admin/authorization/rbac/).
    rbac:
      groups:
        'botkube-plugins-default':
          create: true
          rules:
            - apiGroups: ["*"]
              resources: ["*"]
              verbs: ["get", "watch", "list"]

    communications:
      default-group:
        discord:
          enabled: true
          channels:
            default:
              notification:
                disabled: false
              bindings:
                executors:
                  - k8s-default-tools
                sources:
                  - k8s-recommendation-events
                  - k8s-all-events
                  - k8s-err-with-logs-events

          notification:
            type: short

    serviceMonitor:
      enabled: false

    actions:
      'describe-created-resource':
        enabled: false
      'show-logs-on-error':
        enabled: true

    sources:
      k8s-recommendation-events:
        botkube/kubernetes:
          enabled: true

      k8s-all-events:
        botkube/kubernetes:
          enabled: true
          # NOTE: this MUST live under `config:` — a bare `resources:` here is
          # silently ignored and the chart defaults apply instead.
          config:
            # Volume churn is wanted signal, but only the failures. Every
            # scheduled volsync sync creates a mover pod plus a `-src` clone
            # PVC and then tears both down — ~16 create/delete pairs a day of
            # pure noise. A mover stuck on FailedAttachVolume, though, means a
            # Longhorn clone is wedged. So pods and clone PVCs are each split
            # into a quiet routine rule and a loud error-only rule.
            #
            # Two non-obvious things encoded below:
            #   - `exclude` without `include` matches NOTHING — IsAllowed()
            #     returns false when include is empty — hence `include: [".*"]`
            #     on the routine rules.
            #   - a per-resource `event.types` REPLACES the chart's global
            #     [create, delete, error]; it does not merge with it.
            resources:
              - type: v1/pods
                name:
                  include: [".*"]
                  exclude: ["^volsync-(src|dst)-"]
              - type: v1/pods
                name:
                  include: ["^volsync-(src|dst)-"]
                event:
                  types: [error]

              # PV names are random `pvc-<uuid>`, so there is no pattern to
              # filter on and every clone churns one. Errors only.
              - type: v1/persistentvolumes
                event:
                  types: [error]

              # Only `volsync-<app>-src` is per-run; the `-cache` and
              # `-bootstrap-dest` claims are long-lived and worth watching.
              - type: v1/persistentvolumeclaims
                name:
                  include: [".*"]
                  exclude: ["^volsync-.*-src$"]
              - type: v1/persistentvolumeclaims
                name:
                  include: ["^volsync-.*-src$"]
                event:
                  types: [error]

              - type: v1/services
              - type: networking.k8s.io/v1/ingresses
              - type: v1/nodes
              - type: v1/namespaces
              - type: v1/configmaps
              - type: rbac.authorization.k8s.io/v1/roles
              - type: rbac.authorization.k8s.io/v1/rolebindings
              - type: rbac.authorization.k8s.io/v1/clusterrolebindings
              - type: rbac.authorization.k8s.io/v1/clusterroles
              - type: apps/v1/daemonsets
              - type: apps/v1/deployments
              - type: apps/v1/statefulsets

      k8s-err-with-logs-events:
        botkube/kubernetes:
          enabled: true

    executors:
      k8s-default-tools:
        botkube/kubectl:
          enabled: true

    aliases:
      k:
        command: kubectl
        displayName: "Kubectl alias"

      kgp:
        command: kubectl get pods
        displayName: "Get pods"

    resources:
      requests:
        cpu: 100m
        memory: 138Mi
      limits:
        memory: 1000Mi

    analytics:
      disable: true

  valuesFrom:
    - targetPath: communications.default-group.discord.token
      kind: Secret
      name: botkube-config-secret
      valuesKey: BOTKUBE_DISCORD_TOKEN
    - targetPath: communications.default-group.discord.botID
      kind: Secret
      name: botkube-config-secret
      valuesKey: BOTKUBE_DISCORD_BOT_ID
    - targetPath: communications.default-group.discord.channels.default.id
      kind: Secret
      name: botkube-config-secret
      valuesKey: BOTKUBE_DISCORD_CHANNEL_ID
