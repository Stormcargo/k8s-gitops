---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    # Mounted into the Alertmanager pod at /etc/vm/secrets/alertmanager-secret/
    # via alertmanager.spec.secrets, and read with the receivers' *_file fields so
    # the URLs never land in the rendered config Secret or in git.
    name: alertmanager-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        discord-webhook-url: "{{ .ALERTMANAGER_DISCORD_WEBHOOK_URL }}"
        heartbeat-url: "{{ .ALERTMANAGER_HEARTBEAT_URL }}"
  dataFrom:
    - extract:
        key: alertmanager
