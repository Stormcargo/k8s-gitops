---
alertmanager:
  interval: 1m
  servers:
    - name: home
      uri: http://vmalertmanager-alerts.observability.svc.cluster.local:9093
      timeout: 10s
      proxy: true
      healthcheck:
        visible: false
        filters:
          network:
            # Unquoted: karma takes everything after "=" literally, so
            # alertname="Watchdog" would only match a name containing the quotes.
            - alertname=Watchdog

alertAcknowledgement:
  enabled: true

filters:
  default:
    - "@state!=suppressed"
