---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: chaski
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: chaski-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # The #media channel's webhook. Alertmanager posts to a different
        # channel through its own webhook (victoria-metrics/app/externalsecret.yaml).
        DISCORD_MEDIA_WEBHOOK_URL: "{{ .CHASKI_DISCORD_WEBHOOK_URL }}"
  dataFrom:
    - extract:
        key: chaski
