---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: goldpinger
spec:
  interval: 30m
  chart:
    spec:
      chart: goldpinger
      version: 1.2.0
      sourceRef:
        kind: HelmRepository
        name: goldpinger
        namespace: flux-system
      interval: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    image:
      tag: 3.10.2

    resources: {}
      # limits:
      #  cpu: 100m
      #  memory: 128Mi
      # requests:
      #  cpu: 100m
      #  memory: 128Mi

    updateStrategy: {}
      # type: RollingUpdate
      # rollingUpdate:
      #   maxUnavailable: 1

    serviceMonitor:
      enabled: true

    # Converted to a VMRule by vm-operator. Setting rules replaces the chart default list, so
    # goldpinger_nodes_unhealthy is carried over here. Rules go through tpl, hence the {{ "{{ }}" }} escaping.
    prometheusRule:
      enabled: true
      rules:
        - alert: goldpinger_nodes_unhealthy
          expr: |
            sum(goldpinger_nodes_health_total{job="goldpinger", status="unhealthy"})
            BY (instance, goldpinger_instance) > 0
          for: 5m
          annotations:
            description: |
              Goldpinger instance {{ "{{ $labels.goldpinger_instance }}" }} has been reporting unhealthy nodes for at least 5 minutes.
            summary: Goldpinger on {{ "{{ $labels.goldpinger_instance }}" }} cannot reach some nodes
          labels:
            severity: warning
        # Baseline ping p95 is ~5ms per node, worst 5m window over a week ~32ms (2026-10-10).
        - alert: goldpinger_peer_latency_high
          expr: |
            histogram_quantile(0.95,
              sum by (goldpinger_instance, le) (
                rate(goldpinger_peers_response_time_s_bucket{job="goldpinger", call_type="ping"}[5m])
              )
            ) > 0.1
          for: 10m
          annotations:
            description: |
              Goldpinger instance {{ "{{ $labels.goldpinger_instance }}" }} has seen p95 ping latency to its peers above 100ms for 10 minutes (currently {{ "{{ $value | humanizeDuration }}" }}).
            summary: Slow pod network from {{ "{{ $labels.goldpinger_instance }}" }}
          labels:
            severity: warning

    httpRoute:
      enabled: true
      annotations:
        glance/internal: "true"
        glance/icon: di:flightradar24
        glance/description: Internal Connectivity Checker
      hostnames:
        - "goldpinger.${SECRET_DOMAIN}"
      parentRefs:
        - name: internal
          namespace: network
          sectionName: https
