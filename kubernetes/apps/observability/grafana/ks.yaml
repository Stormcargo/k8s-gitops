---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: grafana
  namespace: flux-system
spec:
  targetNamespace: observability
  path: ./kubernetes/apps/observability/grafana/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: false # no flux ks dependents
  interval: 30m
  timeout: 5m
  dependsOn:
    - name: external-secrets-stores
    - name: gateway
    - name: longhorn
    - name: volsync
  postBuild:
    substitute:
      APP: grafana
      VOLSYNC_CAPACITY: 1Gi
      VOLSYNC_SCHEDULE: "0 6 * * *"
      # Grafana runs as 472, not the template's 568 default
      VOLSYNC_UID: "472"
      VOLSYNC_GID: "472"
