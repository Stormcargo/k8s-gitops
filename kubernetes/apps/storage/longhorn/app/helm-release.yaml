---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: storage
spec:
  releaseName: longhorn
  interval: 5m
  chart:
    spec:
      # renovate: registryUrl=https://charts.longhorn.io
      chart: longhorn
      version: 1.12.0
      sourceRef:
        kind: HelmRepository
        name: longhorn-charts
        namespace: flux-system
      interval: 5m
  values:
    persistence:
      defaultClass: true
    defaultSettings:
      defaultDataPath: /var/mnt/longhorn
      # backupTarget: s3://longhorn@weur/
      backupTargetCredentialSecret: longhorn-backup-secret
      defaultDataLocality: best-effort
      defaultReplicaCount: "3"
      defaultLonghornStaticStorageClass: longhorn
      # createDefaultDiskLabeledNodes: false
      nodeDownPodDeletionPolicy: delete-both-statefulset-and-deployment-pod
      # Allow node drains once a replica is stopped (i.e. its volume is detached).
      # The default block-if-contains-last-replica pins the instance-manager PDB for
      # every single-replica volsync *-cache volume, blocking Talos upgrades.
      # Volumes still attached (e.g. postgres17-1) continue to block until they detach.
      nodeDrainPolicy: allow-if-replica-is-stopped
      concurrentAutomaticEngineUpgradePerNodeLimit: "1"
      storageMinimalAvailablePercentage: "10"
      StorageOverProvisioningPercentage: "120"
      storageReservedPercentageForDefaultDisk: "20"

      v1DataEngine: true
      v2DataEngine: false
    metrics:
      serviceMonitor:
        enabled: true
