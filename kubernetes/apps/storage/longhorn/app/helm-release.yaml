---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: storage
spec:
  releaseName: longhorn
  interval: 5m
  chart:
    spec:
      # renovate: registryUrl=https://charts.longhorn.io
      chart: longhorn
      version: 1.12.1
      sourceRef:
        kind: HelmRepository
        name: longhorn-charts
        namespace: flux-system
      interval: 5m
  values:
    persistence:
      defaultClass: true
    defaultSettings:
      defaultDataPath: /var/mnt/longhorn
      # backupTarget: s3://longhorn@weur/
      backupTargetCredentialSecret: longhorn-backup-secret
      defaultDataLocality: best-effort
      defaultReplicaCount: "3"
      defaultLonghornStaticStorageClass: longhorn
      # createDefaultDiskLabeledNodes: false
      nodeDownPodDeletionPolicy: delete-both-statefulset-and-deployment-pod
      # Allow node drains once a replica is stopped (i.e. its volume is detached).
      # The default block-if-contains-last-replica pins the instance-manager PDB for
      # every single-replica volsync *-cache volume, blocking Talos upgrades.
      # Volumes still attached (e.g. postgres17-1) continue to block until they detach.
      nodeDrainPolicy: allow-if-replica-is-stopped
      # Reclaim orphaned replica directories automatically. Without this, replicas
      # orphaned by a node upgrade linger forever: the 2026-07-05 Talos run left 139
      # on rzmini-03 holding ~759GB, taking it to 13% free (unschedulable at 10%).
      orphanResourceAutoDeletion: replica-data
      concurrentAutomaticEngineUpgradePerNodeLimit: "1"
      storageMinimalAvailablePercentage: "10"
      # NOTE: this was "StorageOverProvisioningPercentage" (capital S), a key the chart
      # does not have, so it was silently dropped -- the generated longhorn-default-setting
      # ConfigMap has never contained storage-over-provisioning-percentage, and the
      # effective value has always been Longhorn's default of 100. Uncommenting the line
      # below would be a real behaviour change (more replica scheduling per disk), so it
      # is left off to preserve the behaviour the cluster has actually been running.
      # storageOverProvisioningPercentage: "120"
      storageReservedPercentageForDefaultDisk: "20"

      v1DataEngine: true
      v2DataEngine: false
    metrics:
      serviceMonitor:
        enabled: true
