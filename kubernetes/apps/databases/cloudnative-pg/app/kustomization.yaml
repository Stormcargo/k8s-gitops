---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The barman-cloud plugin manifest hardcodes namespace cnpg-system, but CNPG
# discovers plugins by watching for a Service labelled cnpg.io/pluginName in the
# *operator's* namespace, which here is databases. This transformer rewrites all
# 12 namespace fields and, importantly, the ClusterRoleBinding subject
# namespaces. The CRD and ClusterRoles stay cluster-scoped, and the server
# Certificate uses a bare dnsName (barman-cloud) so its TLS SANs are unaffected.
namespace: databases
resources:
  - ./helm-release.yaml
  - ./external-secret.yaml
  # renovate: datasource=github-releases depName=cloudnative-pg/plugin-barman-cloud
  - https://github.com/cloudnative-pg/plugin-barman-cloud/releases/download/v0.15.0/manifest.yaml
