---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres17
  namespace: databases
  annotations:
    cnpg.io/skipEmptyWalArchiveCheck: "enabled"
spec:
  # 3 instances (1 primary + 2 streaming standbys). longhorn-cnpg is deliberately
  # numberOfReplicas=1 + strict-local, so redundancy lives at the Postgres layer,
  # not the storage layer. With instances: 1 there were no standbys, so the
  # PDB (minAvailable=1) refused every eviction and node drains deadlocked.
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:17.7
  primaryUpdateStrategy: unsupervised
  storage:
    size: 40Gi
    storageClass: longhorn-cnpg

  # One instance per node. Required (not preferred) so two instances can never
  # share a node -- with strict-local volumes that would put two copies on one
  # disk. On a 3-node cluster this means a drained node's instance stays Pending
  # until it returns, which is intended: the other two keep serving.
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname
  # The operator defaults probes.liveness.isolationCheck to enabled with a 1s
  # connect+request budget. That check kills the primary if it cannot reach its
  # peers in time -- and at instances: 1 it was dormant, so going to 3 armed it.
  # On this cluster 1s is far too tight (etcd latency, and multus was resolving
  # the apiserver through the 10.96.0.1 ClusterIP), so the primary was declaring
  # itself isolated and restarting. Each restart bumped the timeline, standbys
  # then failed pg_rewind with "could not find common ancestor" and could never
  # rejoin, which kept the peers unreachable -- a self-sustaining failover storm
  # (109 restarts on one instance). Pinned off so the webhook cannot re-enable it.
  probes:
    liveness:
      isolationCheck:
        enabled: false

  superuserSecret:
    name: cloudnative-pg-secret
  enableSuperuserAccess: true
  resources:
    requests:
      memory: 1.5Gi
    limits:
      memory: 2Gi

  # Bootstrap from scratch initially
  # bootstrap:
  #   recovery:
  #     source: &previousCluster postgres16-v5

  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: 512MB

  monitoring:
    enablePodMonitor: true
    # https://github.com/cloudnative-pg/cloudnative-pg/issues/2501
    podMonitorMetricRelabelings:
      - { sourceLabels: [ "cluster" ], targetLabel: cnpg_cluster, action: replace }
      - { regex: cluster, action: labeldrop }

  backup:
    retentionPolicy: "30d"

    barmanObjectStore:
      wal:
        compression: bzip2
        maxParallel: 4
      data:
        compression: bzip2

      serverName:  postgres17-v1
      destinationPath: s3://cloudnative-pg/cnpg
      endpointURL: https://8107775533e1b38958f2bfea727bdef2.r2.cloudflarestorage.com


      s3Credentials:
        accessKeyId:
          name: cloudnative-pg-secret
          key: aws-access-key-id
        secretAccessKey:
          name: cloudnative-pg-secret
          key: aws-secret-access-key

  # Uncomment when you need to recover from backups
  # externalClusters:
  #   - name: postgres17-v1
  #     barmanObjectStore:
  #       wal:
  #         compression: bzip2
  #         maxParallel: 8
  #       destinationPath: s3://cloudnative-pg/postgres17/
  #       endpointURL: https://8107775533e1b38958f2bfea727bdef2.r2.cloudflarestorage.com
  #       serverName: postgres17-v1
  #       s3Credentials:
  #         accessKeyId:
  #           name: cloudnative-pg-secret
  #           key: aws-access-key-id
  #         secretAccessKey:
  #           name: cloudnative-pg-secret
  #           key: aws-secret-access-key
