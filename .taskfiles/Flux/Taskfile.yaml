---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: '3'

tasks:

  bootstrap:
    desc: Create the flux-system prerequisites (run before talos:apps)
    # Flux itself is installed by the flux-operator and flux-instance releases in
    # kubernetes/bootstrap/apps/helmfile.yaml (task talos:apps). All this does is
    # put the sops-age key in place first, so the Kustomizations the FluxInstance
    # creates can decrypt on their very first reconcile instead of erroring.
    cmds:
      - kubectl create namespace flux-system --dry-run=client -o yaml | kubectl apply --server-side --filename -
      - |
        if ! kubectl --namespace flux-system get secret sops-age &>/dev/null; then
          cat {{.SOPS_AGE_KEY_FILE}} | kubectl --namespace flux-system create secret generic sops-age --from-file=age.agekey=/dev/stdin
        else
          echo "sops-age secret already exists, skipping creation."
        fi
    preconditions:
      - test -f {{.KUBECONFIG}}
      - test -f {{.SOPS_AGE_KEY_FILE}}
      - which kubectl

  reconcile:
    desc: Force update Flux to pull in changes from your Git repository
    cmd: flux reconcile --namespace flux-system kustomization flux-system --with-source
    preconditions:
      - msg: Missing kubeconfig
        sh: test -f {{.KUBECONFIG}}
