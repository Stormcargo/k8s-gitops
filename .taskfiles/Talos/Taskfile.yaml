---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: '3'

vars:
  TALHELPER_CLUSTER_DIR: '{{.KUBERNETES_DIR}}/bootstrap/talos/clusterconfig'
  # Plaintext, gitignored, materialized from 1Password only for the duration of
  # a task and removed by a defer. Never committed.
  TALHELPER_SECRET_FILE: '{{.KUBERNETES_DIR}}/bootstrap/talos/talsecret.yaml'
  TALHELPER_CONFIG_FILE: '{{.KUBERNETES_DIR}}/bootstrap/talos/talconfig.yaml'
  HELMFILE_FILE: '{{.KUBERNETES_DIR}}/bootstrap/apps/helmfile.yaml'
  TALOSCONFIG: '{{.TALHELPER_CLUSTER_DIR}}/talosconfig'
  OP_TALSECRET_ITEM: talsecret
  OP_TALSECRET_VAULT: kubernetes
  # The Windows 1Password CLI reached through WSL interop, so it can use the
  # desktop app for biometric unlock. `op` is only a zsh alias and does not
  # exist in the `sh` that Task shells out to. Override for a native Linux op.
  OP: '{{.OP | default "op.exe"}}'


env:
  TALOSCONFIG: '{{.TALOSCONFIG}}'


tasks:
  test:
    cmds:
      - echo {{.TALOSCONFIG}}
      - echo {{.KUBERNETES_DIR}}
      - echo {{.TALHELPER_CONFIG_FILE}}

  _talsecret-fetch:
    internal: true
    desc: Materialize the Talos secret bundle from 1Password
    cmds:
      # Shell redirect rather than --out-file: op.exe is a Windows binary and
      # would read an absolute Linux path as a Windows one.
      # Pre-create at 0600 first — `>` truncates without changing the mode of an
      # existing file, so the PKI is never briefly world-readable. (Task's shell
      # is mvdan/sh, which has no `umask` builtin.)
      - install -m 600 /dev/null {{.TALHELPER_SECRET_FILE}}
      - '{{.OP}} document get {{.OP_TALSECRET_ITEM}} --vault {{.OP_TALSECRET_VAULT}} > {{.TALHELPER_SECRET_FILE}}'
      - test -s {{.TALHELPER_SECRET_FILE}}
    preconditions:
      - msg: Not signed in to 1Password (run `op signin`)
        sh: '{{.OP}} user get --me'
      - command -v {{.OP}}

  _talsecret-clean:
    internal: true
    cmd: rm -f {{.TALHELPER_SECRET_FILE}}

  gen-secret:
    desc: Generate a NEW Talos secret bundle and store it in 1Password
    prompt: This creates a NEW cluster PKI. Existing nodes will no longer trust it. Continue?
    cmds:
      # Piped straight to 1Password so the new PKI never lands on disk.
      - talhelper gensecret | {{.OP}} document create - --title {{.OP_TALSECRET_ITEM}} --vault {{.OP_TALSECRET_VAULT}} --file-name talsecret.yaml
    preconditions:
      - msg: Not signed in to 1Password (run `op signin`)
        sh: '{{.OP}} user get --me'
      - command -v talhelper
      - command -v {{.OP}}

  gen-config:
    desc: Generate Talos configuration files
    dir: '{{.KUBERNETES_DIR}}/bootstrap/talos'
    cmds:
      # Registered before the fetch: a defer only fires if the task reached the
      # line that registers it, so a failing fetch would otherwise strand the file.
      - defer: { task: _talsecret-clean }
      - task: _talsecret-fetch
      - talhelper genconfig --config-file {{.TALHELPER_CONFIG_FILE}} --secret-file {{.TALHELPER_SECRET_FILE}} --out-dir {{.TALHELPER_CLUSTER_DIR}}
    preconditions:
      - test -f {{.TALHELPER_CONFIG_FILE}}
      - command -v talhelper
      - command -v {{.OP}}

  apply:
    desc: Apply Talos configuration to a node
    cmds:
      - talosctl --nodes {{.HOSTNAME}} apply-config --mode={{.MODE}} --file {{.TALHELPER_CLUSTER_DIR}}/{{.CLUSTER_NAME}}-{{.HOSTNAME}}.yaml
      - talosctl --nodes {{.HOSTNAME}} health --wait-timeout=10m --server=false
    vars:
      CLUSTER_NAME: home-k8s
      MODE: '{{.MODE | default "auto"}}'
    requires:
      vars: [HOSTNAME]
    preconditions:
      # - talosctl --nodes {{.HOSTNAME}} get machineconfig
      - talosctl config info
      - test -f {{.TALHELPER_CLUSTER_DIR}}/{{.CLUSTER_NAME}}-{{.HOSTNAME}}.yaml
      - test -f {{.TALOSCONFIG}}
      - which talosctl yq


  bootstrap:
    desc: Bootstrap the Talos cluster
    dir: '{{.KUBERNETES_DIR}}/bootstrap/talos'
    cmds:
      # Registered before the fetch: a defer only fires if the task reached the
      # line that registers it, so a failing fetch would otherwise strand the file.
      - defer: { task: _talsecret-clean }
      - task: _talsecret-fetch
      - talhelper genconfig --config-file {{.TALHELPER_CONFIG_FILE}} --secret-file {{.TALHELPER_SECRET_FILE}} --out-dir {{.TALHELPER_CLUSTER_DIR}}
      - talhelper gencommand apply --config-file {{.TALHELPER_CONFIG_FILE}} --out-dir {{.TALHELPER_CLUSTER_DIR}} --extra-flags="--insecure" | bash
      - until talhelper gencommand bootstrap --config-file {{.TALHELPER_CONFIG_FILE}} --out-dir {{.TALHELPER_CLUSTER_DIR}} | bash; do sleep 10; done
      - task: conf
      - task: apps
      - talosctl health --server=false
    preconditions:
      - test -f {{.TALHELPER_CONFIG_FILE}}
      - msg: Not signed in to 1Password (run `op signin`)
        sh: '{{.OP}} user get --me'
      - command -v talhelper
      - command -v {{.OP}}

  upgrade:
    desc: Upgrade Talos on a node
    cmds:
      - talosctl --nodes {{.HOSTNAME}} upgrade --image="factory.talos.dev/installer/{{.TALOS_SCHEMATIC_ID}}:{{.TALOS_VERSION}}" --timeout=20m
      - talosctl --nodes {{.HOSTNAME}} health --wait-timeout=10m --server=false
    vars:
      TALOS_SCHEMATIC_ID: e570def3e711fa4d3fec3f1351e814d9d8cbc0a597f3d02f161bb34650ad82f7
        # sh: talosctl get nodeannotationspecs --nodes {{.HOSTNAME}} -o jsonpath='{.spec.value}'
      TALOS_VERSION:
        sh: yq '.talosVersion' {{.TALHELPER_CONFIG_FILE}}
      TALOS_SECUREBOOT: "false"
        # sh: talosctl --nodes {{.HOSTNAME}} get securitystate --output=jsonpath='{.spec.secureBoot}'
    requires:
      vars: ['HOSTNAME']
    preconditions:
      - curl -fsSL -o /dev/null --fail https://github.com/siderolabs/talos/releases/tag/{{.TALOS_VERSION}}
      - talosctl --nodes {{.NODE}} get machineconfig
      - talosctl config info
      - test -f {{.TALOSCONFIG}}
      - which kubectl talosctl yq

  upgrade-cluster:
    desc: Upgrade Talos on the whole cluster
    cmds:
      - for: { var: HOSTNAMES }
        task: upgrade
        vars:
          HOSTNAME: '{{.ITEM}}'
          ROLLOUT: true
    vars:
      HOSTNAMES:
        sh: kubectl get nodes --output=jsonpath='{.items[*].metadata.name}'

  upgrade-k8s:
    desc: Upgrade Kubernetes
    cmds:
      - talosctl --nodes {{.KUBERNETES_CONTROLLER}} upgrade-k8s --to {{.KUBERNETES_VERSION}}
    vars:
      KUBERNETES_CONTROLLER:
        sh: talosctl config info --output json | jq --raw-output '.endpoints[]' | shuf -n 1
      KUBERNETES_VERSION:
        sh: yq '.kubernetesVersion' {{.TALHELPER_CONFIG_FILE}}
    preconditions:
      - curl -fsSL -o /dev/null --fail https://github.com/siderolabs/kubelet/releases/tag/{{.KUBERNETES_VERSION}}
      - talosctl --nodes {{.KUBERNETES_CONTROLLER}} get machineconfig
      - talosctl config info
      - test -f {{.TALOSCONFIG}}
      - which talosctl yq

  reset:
    desc: Resets nodes back to maintenance mode
    dir: "{{.KUBERNETES_DIR}}/bootstrap/talos"
    prompt: This will destroy your cluster and reset the nodes back to maintenance mode... continue?
    cmd: talhelper gencommand reset --config-file {{.TALHELPER_CONFIG_FILE}} --out-dir {{.TALHELPER_CLUSTER_DIR}} --extra-flags="--reboot {{- if eq .CLI_FORCE false }} --system-labels-to-wipe STATE --system-labels-to-wipe EPHEMERAL{{ end }} --graceful=false --wait=false" | bash

  conf:
    internal: true
    dir: '{{.KUBERNETES_DIR}}/bootstrap/talos'
    cmd: until talhelper gencommand kubeconfig --config-file {{.TALHELPER_CONFIG_FILE}} --out-dir {{.TALHELPER_CLUSTER_DIR}} --extra-flags="{{.ROOT_DIR}} --force" | bash; do sleep 10; done
    preconditions:
      - msg: Missing talhelper config file
        sh: test -f {{.TALHELPER_CONFIG_FILE}}

  apps:
    desc: Bootstrap essential apps into the Talos cluster
    dir: '{{.KUBERNETES_DIR}}/bootstrap/talos'
    cmds:
      - until kubectl wait --for=condition=Ready=False nodes --all --timeout=600s; do sleep 10; done
      - helmfile --file {{.HELMFILE_FILE}} apply --skip-diff-on-install --suppress-diff
      - until kubectl wait --for=condition=Ready nodes --all --timeout=600s; do sleep 10; done
    preconditions:
      - test -f {{.KUBECONFIG}}
      - test -f {{.HELMFILE_FILE}}
      - which helmfile kubectl talosctl

  # Ref: https://github.com/go-task/task/issues/608
  noop:
    internal: true
    silent: true
    cmd: noop() { :; }
