---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: '3'

tasks:

  test:
    desc: Render and validate every Kustomization and HelmRelease offline
    # Same invocation as the flux-test job in .github/workflows/flate.yaml, so a
    # local pass means the same thing CI's does. Renders from the working tree
    # with no cluster contact; --allow-missing-secrets covers the SOPS and
    # ExternalSecret values that only exist in-cluster.
    cmd: flate test all --path {{.KUBERNETES_DIR}}/flux/config --allow-missing-secrets {{.CLI_ARGS}}
    preconditions:
      - msg: Missing flate (task workstation:generic-linux)
        sh: command -v flate

  resources:
    desc: Gather common resources in your cluster, useful when asking for support
    cmds:
      - for: { var: RESOURCE }
        cmd: kubectl get {{.ITEM}} {{.CLI_ARGS | default "-A"}}
    vars:
      RESOURCE: >-
        nodes
        gitrepositories
        kustomizations
        helmrepositories
        helmreleases
        certificates
        certificaterequests
        ingresses
        pods
